<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - End-to-end Web App</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <nav>
    <a href="/" data-testid="nav-home">Home</a>
    <a href="/login" data-testid="nav-login">Login</a>
    <a href="/items" data-testid="nav-items">Items</a>
  </nav>
  <h1 data-testid="home-heading">E2E Web App</h1>
  <p>A small app for end-to-end testing.</p>
  <p id="user-status" data-testid="user-status">Checking sign-in status...</p>
  <script>
    fetch('/api/me').then(async (res) => {
      const el = document.getElementById('user-status');
      el.textContent = res.ok ? `Signed in as ${(await res.json()).email}` : 'You are not signed in.';
    });
  </script>
</body>
</html>
